<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P.S. I Love You</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #d8d6d1;
      font-family: 'Montserrat', sans-serif;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .album-cover-card {
      max-width: 400px;
      width: 100%;
      background: #e2e0db;
      border-radius: 4px;
      padding: 30px 24px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border: 1px solid #c4c2bd;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 480px;
    }
    .album-grid { display: flex; align-items: flex-start; justify-content: space-between; }
    .left-container { width: 48%; text-align: center; }
    .heart-doodle {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 4px;
      display: inline-block;
      transform: rotate(-10deg);
    }
    .album-photo {
      width: 100%;
      height: 230px;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.2);
      border-radius: 2px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .right-container { width: 48%; text-align: left; padding-left: 10px; }
    .marker-title {
      font-family: 'Caveat', cursive;
      font-size: 3.3rem;
      line-height: 0.95;
      color: #111;
    }
    .album-footer { text-align: center; margin-top: 25px; }
    .artist-name {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #222;
      margin-bottom: 18px;
    }
    .open-btn {
      background: #111;
      color: #fff;
      border: none;
      padding: 10px 28px;
      border-radius: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .reasons-wrapper {
      display: none;
      width: 100%;
      max-width: 400px;
      background: #e2e0db;
      border-radius: 4px;
      padding: 20px;
      border: 1px solid #c4c2bd;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .reasons-title {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 15px;
    }
    .reasons-list { max-height: 50vh; overflow-y: auto; padding-right: 5px; }
    .reason-item {
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 8px 0;
      border-bottom: 1px solid #ccc;
    }
    .reason-item strong { font-family: 'Caveat', cursive; font-size: 1.2rem; }
  </style>
</head>
